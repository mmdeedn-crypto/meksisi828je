name: Daily YouTube Stats Report

on:
  schedule:
    # الساعة 9:00 صباحًا بتوقيت ليبيا (UTC+2) = 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py

      - name: Commit updated history file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats_history.json
          git diff --staged --quiet || git commit -m "Update stats history [skip ci]"
          git push
